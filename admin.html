
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESTYLE Admin Panel</title>

<style>
:root{
    --primary:#5a9f8b;
    --primary-dark:#4a8a77;
    --bg:#f5f7f6;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --danger:#ef4444;
    --success:#16a34a;
    --warning:#f59e0b;
    --shadow:0 10px 25px rgba(0,0,0,0.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* TOPBAR */
.topbar{
    background:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:var(--shadow);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:700;
    color:var(--primary);
}

.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.nav button{
    border:none;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    background:#edf6f3;
    transition:0.3s;
    font-weight:500;
}

.nav button:hover,
.nav button.active{
    background:var(--primary);
    color:white;
}

.container{
    padding:25px;
}

/* ADMIN LOGIN */

#adminLoginPage{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    background:#f5f7f6;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.login-box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#5a9f8b;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    background:#5a9f8b;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

/* DASHBOARD CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:var(--shadow);
}

.card h3{
    color:var(--muted);
    font-size:14px;
}

.card h1{
    margin-top:10px;
    color:var(--primary);
    font-size:32px;
}

/* SECTION */
.section{
    display:none;
}

.section.active{
    display:block;
}

/* TABLE */
.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    background:white;
    border-radius:15px;
    overflow:hidden;
    border-collapse:collapse;
    box-shadow:var(--shadow);
    margin-top:20px;
}

th,td{
    padding:15px;
    text-align:left;
    font-size:14px;
}

th{
    background:#eef4f2;
}

tr{
    border-bottom:1px solid #eee;
}

img.product-img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:10px;
}

/* BADGES */
.badge{
    padding:6px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.approved{
    background:#dcfce7;
    color:#166534;
}

.rejected{
    background:#fee2e2;
    color:#991b1b;
}

/* BUTTONS */
.btn{
    border:none;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    color:white;
    font-weight:500;
}

.btn-primary{
    background:var(--primary);
}

.btn-danger{
    background:var(--danger);
}

.btn-success{
    background:var(--success);
}

.btn-warning{
    background:var(--warning);
}

.action-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}
#orderTableBody td{
    vertical-align:middle;
}

/* FORM */
.form-box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:var(--shadow);
    max-width:700px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-box input,
.form-box textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

.form-box textarea{
    grid-column:1/3;
    min-height:120px;
}

.form-box button{
    margin-top:15px;
}

@media(max-width:768px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .form-box textarea{
        grid-column:auto;
    }
}
</style>
</head>
<body>

<!-- ADMIN LOGIN -->

<div id="adminLoginPage">

    <div class="login-box">

        <h2>LuxReWear ADMIN</h2>

        <input
        type="email"
        id="adminEmail"
        placeholder="Admin Email">

        <input
        type="password"
        id="adminPassword"
        placeholder="Password">

        <button onclick="adminLogin()">
            Login
        </button>

    </div>

</div>

<div id="adminPanel" style="display:none;">

<div class="topbar">
    <div class="logo">LuxReWear ADMIN</div>

   <div class="nav">

    <button class="active"
    onclick="showSection('dashboard',event)">
    Dashboard
    </button>

    <button onclick="showSection('products',event)">
    Products
    </button>

    <button onclick="showSection('orders',event)">
    Orders
    </button>

    <button onclick="showSection('users',event)">
    Users
    </button>

    <button onclick="showSection('add-product',event)">
    Add Product
    </button>

    <button onclick="logoutAdmin()">
    Logout
    </button>

</div>
</div>

<div class="container">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">

<div class="cards" id="statsCards">
    <div class="card">
        <h3>Total Products</h3>
        <h1>0</h1>
    </div>
</div>

</div>

<!-- PRODUCTS -->
<div id="products" class="section">

<h2>Pending Product Approvals</h2>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Image</th>
<th>Title</th>
<th>Brand</th>
<th>Price</th>
<th>Seller</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="productTableBody"></tbody>
</table>
</div>

</div>

<!-- ORDERS -->
<div id="orders" class="section">

<h2>Orders Management</h2>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Order ID</th>
<th>User</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="orderTableBody"></tbody>
</table>
</div>

</div>

<!-- USERS -->
<div id="users" class="section">

<h2>Users Management</h2>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>
<tbody id="userTableBody"></tbody>
</table>
</div>

</div>


<!-- ADD PRODUCT -->
<div id="add-product" class="section">

<h2>Add Product</h2>
<br>

<div class="form-box">

<div class="form-grid">

<input type="text" id="title" placeholder="Product Title">

<input type="text" id="brand" placeholder="Brand">

<select id="category">
    <option value="men">Men's Wardrobe</option>
    <option value="women">Women's Wardrobe</option>
    <option value="accessories">Accessories</option>
</select>


<input type="number" id="originalPrice" placeholder="Original Price">


<input type="number" id="price" placeholder="Selling Price">


<select id="condition">
    <option value="New With Tags">New With Tags</option>
    <option value="Like New">Like New</option>
    <option value="Gently Used">Gently Used</option>
    <option value="Vintage">Vintage</option>
</select>


<input type="file" id="imageFile" accept="image/*">


<textarea id="description" placeholder="Description"></textarea>

</div>


<button class="btn btn-primary" onclick="addProduct()">
Add Product
</button>


</div>

</div>

<script>

const API = "http://localhost:5000";

/* ================= NAVIGATION ================= */
function showSection(id,e){

    document.querySelectorAll('.section').forEach(sec=>{
        sec.classList.remove('active');
    });

    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.nav button').forEach(btn=>{
        btn.classList.remove('active');
    });

    e.target.classList.add('active');
}

/* ================= DASHBOARD STATS ================= */
async function loadStats(){

    try{

        const res = await fetch(API + '/api/admin/stats');
        const data = await res.json();

        document.getElementById('statsCards').innerHTML = `

        <div class="card">
            <h3>Total Products</h3>
            <h1>${data.products}</h1>
        </div>

        <div class="card">
            <h3>Pending Products</h3>
            <h1>${data.pendingProducts}</h1>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <h1>${data.orders}</h1>
        </div>

        <div class="card">
            <h3>Total Users</h3>
            <h1>${data.users}</h1>
        </div>

        `;

    }catch(err){
        console.log(err);
    }
}

/* ================= LOAD PRODUCTS ================= */
async function loadProducts(){

    try{

        const res = await fetch(API + '/api/admin/products');
        const data = await res.json();

        let html = '';

        data.forEach(p=>{

            html += `
            <tr>
                <td><img class="product-img" src="${p.image}" /></td>
                <td>${p.title}</td>
                <td>${p.brand}</td>
                <td>₹${p.price}</td>
                <td>${p.sellerEmail}</td>
                <td>
                    <span class="badge ${p.status}">${p.status}</span>
                </td>
                <td>
                    <div class="action-buttons">

                        <button class="btn btn-success"
                        onclick="approveProduct('${p.id}')">
                        Approve
                        </button>

                        <button class="btn btn-danger"
                        onclick="rejectProduct('${p.id}')">
                        Reject
                        </button>

                        <button class="btn btn-warning"
                        onclick="deleteProduct('${p.id}')">
                        Delete
                        </button>

                    </div>
                </td>
            </tr>
            `;
        });

        document.getElementById('productTableBody').innerHTML = html;

    }catch(err){
        console.log(err);
    }
}

/* ================= APPROVE PRODUCT ================= */
async function approveProduct(id){

    await fetch(API + '/api/admin/approve-product/' + id,{
        method:'PUT'
    });

    loadProducts();
    loadStats();
}

/* ================= REJECT PRODUCT ================= */
async function rejectProduct(id){

    await fetch(API + '/api/admin/reject-product/' + id,{
        method:'PUT'
    });

    loadProducts();
    loadStats();
}

/* ================= DELETE PRODUCT ================= */
async function deleteProduct(id){

    await fetch(API + '/api/products/' + id,{
        method:'DELETE'
    });

    loadProducts();
    loadStats();
}

/* ================= USERS ================= */
async function loadUsers(){

    try{

        const res = await fetch(API + '/api/admin/users');
        const data = await res.json();

        let html = '';

        data.forEach(u=>{

            html += `
            <tr>
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.role || 'User'}</td>
                <td>

                    <button class="btn btn-danger"
                    onclick="deleteUser('${u.email}')">
                    Delete
                    </button>

                </td>
            </tr>
            `;
        });

        document.getElementById('userTableBody').innerHTML = html;

    }catch(err){
        console.log(err);
    }
}

/* ================= DELETE USER ================= */
async function deleteUser(email){

    await fetch(API + '/api/admin/delete-user/' + email,{
        method:'DELETE'
    });

    loadUsers();
    loadStats();
}

/* ================= LOAD ORDERS ================= */
async function loadOrders(){

    try{

        const res = await fetch(API + '/api/orders/all');
        const data = await res.json();

        console.log("Orders Data:", data);

        let html = '';

        data.forEach(o=>{

            html += `
            <tr>
                <td>${o.orderId || '-'}</td>
                <td>${o.userEmail || '-'}</td>
                <td>₹${o.totalAmount || 0}</td>
                <td>
                    <span class="badge ${
                       o.status === 'Approved'
                       ? 'approved'
                       : o.status === 'Rejected'
                       ? 'rejected'
                       : 'pending'
                    }">
                         ${o.status || 'Pending'}
                       </span>
            </td>
                <td>
                    <div class="action-buttons">

                    <button class="btn btn-success"
                    onclick="updateOrder('${o.orderId}','Approved')">
                    Approve
                    </button>
            
                    <button class="btn btn-danger"
                    onclick="updateOrder('${o.orderId}','Rejected')">
                    Reject
                    </button>

                </div>
           </td>
                
            </tr>
            `;
        });

        document.getElementById('orderTableBody').innerHTML = html;

    }catch(err){
        console.log(err);
    }
}
/* ================= UPDATE ORDER ================= */
async function updateOrder(id,status){

    await fetch(API + '/api/orders/update/' + id,{
        method:'PUT',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify({status})
    });

    loadOrders();
}

/* ================= ADD PRODUCT ================= */

async function addProduct(){

    const title = document.getElementById('title').value;
    const brand = document.getElementById('brand').value;
    const price = document.getElementById('price').value;
    const description = document.getElementById('description').value;

    const category = document.getElementById('category').value;
    const originalPrice = document.getElementById('originalPrice').value;
    const condition = document.getElementById('condition').value;

    const fileInput = document.getElementById('imageFile');


    if(title === '' || brand === '' || price === '' || description === ''){

        alert('Please fill all fields');
        return;
    }


    if(fileInput.files.length === 0){

        alert('Please select image');
        return;
    }


    const file = fileInput.files[0];

    const reader = new FileReader();

    reader.readAsDataURL(file);


    reader.onload = async function(){

        const imageBase64 = reader.result;


        const product = {

            id: Date.now(),

            title: title,

            brand: brand,

            category: category,

            originalPrice: Number(originalPrice),

            price: Number(price),

            condition: condition,

            image: imageBase64,

            description: description,

            tag: "Admin Added",

            sellerEmail: "admin@restyle.com",

            status: "approved"
        };


        await fetch(API + '/api/products', {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body: JSON.stringify(product)

        });


        alert('Product Added');


        document.getElementById('title').value='';
        document.getElementById('brand').value='';
        document.getElementById('price').value='';
        document.getElementById('description').value='';
        document.getElementById('imageFile').value='';


        loadProducts();
        loadStats();

    };
}
/* ADMIN LOGIN */

async function adminLogin(){

    const email =
    document.getElementById(
    "adminEmail").value;

    const password =
    document.getElementById(
    "adminPassword").value;

    if(
        email === "admin@restyle.com" &&
        password === "admin123"
    ){

        localStorage.setItem(
        "adminLoggedIn",
        "true");

        document.getElementById(
        "adminLoginPage").style.display="none";

        document.getElementById(
        "adminPanel").style.display="block";

        loadStats();
        loadProducts();
        loadUsers();
        loadOrders();

    }else{

        alert(
        "Invalid Admin Credentials"
        );

    }
}

function logoutAdmin() {

    // Remove admin login status
    localStorage.removeItem("adminLoggedIn");

    // Redirect to main website
    window.location.href = "index.html";
}


/* ================= INIT ================= */
window.onload = function(){

    if(
        localStorage.getItem(
        "adminLoggedIn"
        ) === "true"
    ){

        document.getElementById(
        "adminLoginPage"
        ).style.display = "none";

        document.getElementById(
        "adminPanel"
        ).style.display = "block";

        loadStats();
        loadProducts();
        loadUsers();
        loadOrders();

    }

}

</script>
</div>
</body>
</html>
